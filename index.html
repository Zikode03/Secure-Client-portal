<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f4" />
    <title>Accounting Document Control &amp; Compliance Portal</title>
    <meta
      name="description"
      content="React and TypeScript frontend for the Accounting Document Control and Compliance Portal."
    />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("secure-client-portal-theme");
          const systemPrefersDark = typeof window.matchMedia === "function"
            && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = storedTheme === "dark" || storedTheme === "light"
            ? storedTheme
            : systemPrefersDark ? "dark" : "light";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("theme-dark", isDark);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", isDark ? "#090909" : "#eef1f4");
        } catch {
          // The React theme provider will apply the default if storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
